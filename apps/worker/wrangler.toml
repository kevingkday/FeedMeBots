name = "feedmebots"
main = "src/index.ts"
compatibility_date = "2024-09-03"
compatibility_flags = ["nodejs_compat"]

[alias]
"@feedmebots/engine" = "../../packages/engine/src/index.ts"

[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "feedmebots-db"
database_id = "feedmebots-local-db"
migrations_dir = "migrations"

# Cloudflare Durable Objects for Real-Time Table Coordination
[durable_objects]
bindings = [
  { name = "TABLE_RUNNER", class_name = "TableDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["TableDurableObject"]
